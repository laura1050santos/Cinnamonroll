{% extends 'core/base.html' %}

{% block title %}Área de Login - Cinnamonroll{% endblock %}

{% block content %}
<section class="login-section">
    <div class="login-container">
        <h2>Entrar na sua conta</h2>
        <form method="POST">
            {% csrf_token %}
            <!-- Coloque seus campos de login aqui (ex: email, senha) -->
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <p class="register-redirect" style="text-align: center; margin-top: 15px;">
            Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>
    </div>
</section>
{% endblock %}
