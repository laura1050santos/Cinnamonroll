{% extends 'core/base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'forms.css' %}">
<link rel="stylesheet" href="{% static 'perfis.css' %}">
{% endblock %}

{% block content %}

<h2>Editar produto</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label for="nome">Nome:</label>
    <input
        type="text"
        id="nome"
        name="nome"
        value="{{ produto.nome }}"
        required
    >

    <label for="descricao">Descrição:</label>
    <textarea
        id="descricao"
        name="descricao"
        required
    >{{ produto.descricao }}</textarea>

    <label for="preco">Preço:</label>
    <input
        type="number"
        id="preco"
        name="preco"
        step="0.01"
        min="0"
        value="{{ produto.preco }}"
        required
    >

    <label for="estoque">Estoque:</label>
    <input
        type="number"
        id="estoque"
        name="estoque"
        min="0"
        value="{{ produto.estoque }}"
        required
    >

    <label for="imagem">Imagem:</label>
    <input
        type="file"
        id="imagem"
        name="imagem"
        accept="image/*"
    >

    {% if produto.imagem %}
        <p>Imagem atual:</p>
        <img
            src="{{ produto.imagem.url }}"
            alt="{{ produto.nome }}"
            width="200"
        >
    {% endif %}

    <button type="submit" class="botao-adicionar">
        Salvar alterações
    </button>

    <a href="{% url 'perfilVendedor' %}" class="botao-adicionar">
        Cancelar
    </a>

</form>

{% endblock %}
