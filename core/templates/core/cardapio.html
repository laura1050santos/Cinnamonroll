{% extends 'core/base.html' %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'forms.css' %}">
<link rel="stylesheet" href="{% static 'perfis.css' %}">
{% endblock %}
{% block content %}

<h1>Cardápio</h1>
<br>
<form method="GET" action="{% url 'searchpage' %}">
    <div class="search-box">
        <input 
            type="text" 
            name="q" 
            placeholder="Buscar docerias, bolos ou confeiteiras..."
            required
        >
        <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
</form>
<div class="produtos-grid">

    {% for produto in produtos %}

        {% include 'core/componentes/card_produto.html' %}

    {% empty %}

        <p>Nenhum produto encontrado.</p>

    {% endfor %}

</div>

{% endblock %}
