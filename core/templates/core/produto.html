<form method="post" action="{% url 'adicionar_carrinho' produto.id %}">
    {% csrf_token %}

    <button type="submit">
        Adicionar ao carrinho
    </button>
    <p>
    Vendido por:
    <a href="{% url 'perfilVendedor' produto.vendedor.id %}">
        {{ produto.vendedor.nome_loja }}
    </a>
</p>
</form>
