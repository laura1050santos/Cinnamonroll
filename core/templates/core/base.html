<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cinnamonroll - O Delivery de Doces Mais Fofo do Mundo{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Arquivo CSS Externo (Django Static) -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">

    {% block head %}{% endblock %}
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-cloud"></i>
            <h1>Cinnamonroll</h1>
        </div>

        <div class="address-bar">
            <i class="fa-solid fa-location-dot" style="color: var(--accent-pink);"></i>
            <span>Entregar em: <strong>Rua das Nuvens Fofas, 123</strong></span>
            <i class="fa-solid fa-angle-down"></i>
        </div>

        <div class="user-actions">
            <a href="{% url 'login' %}" class="btn-action"><i class="fa-regular fa-user"></i> Entrar</a>
            <a href="{% url 'cadastro' %}" class="btn-action"><i class="fa-solid fa-user-plus"></i> Cadastrar</a>
            <a href="{% url 'carrinho' %}" class="btn-cart"><i class="fa-solid fa-basket-shopping"></i> Sacola</a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        {% block content %}
        <!-- O conteúdo específico de cada página será injetado aqui -->
        {% endblock %}
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 Cinnamonroll Delivery de Doces. Inspirado na estética da Sanrio e na praticidade do iFood.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
